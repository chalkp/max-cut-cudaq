[project]
name = "maxcut-qiskit"
version = "0.1.0"
description = "Qiskit port of max-cut-cudaq: LR-QAOA circuits on Qiskit Aer, for IBM hardware"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "qiskit==2.5.2",
    "qiskit-aer-gpu-cu11==0.17.2",
    "qiskit-ibm-runtime==0.50.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "networkx>=3.2",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxcut_qiskit"]

[tool.ruff]
line-length = 100

[tool.uv]
exclude-newer = "2026-10-15T00:00:00Z"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
exclude-newer = "2026-10-15"

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
maxcut-qiskit = { path = ".", editable = true }

[tool.pixi.tasks]
pilot = "python experiments/gap_pilot.py"
depth-matched = "python experiments/depth_matched.py"
