[project]
name = "maxcut-cudaq"
version = "0.1.0"
description = "LR-QAOA on solvable MaxCut graphs: exact formulas and CUDA-Q statevector experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cuda-quantum-cu13==0.15.0",
    "cupy-cuda13x>=13.6,<14",
    "numpy>=2.0",
    "scipy>=1.13",
    "networkx>=3.2",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxcut_cudaq"]

[tool.ruff]
line-length = 100

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
maxcut-cudaq = { path = ".", editable = true }

[tool.pixi.tasks]
sweep = "python experiments/lr_sweep.py"
fit = "python experiments/lr_sweep.py --fit"
pilot = "python experiments/gap_pilot.py"
depth-matched = "python experiments/depth_matched.py"
q1-q5-q6 = "python experiments/q1_q5_q6.py"
limits = "python experiments/delta_limits.py"
solvable = "python experiments/solvable_models.py"

[tool.ruff.lint.per-file-ignores]
"src/maxcut_cudaq/engine.py" = ["F821"]   # cudaq kernel builtins (h, r1, rx)
